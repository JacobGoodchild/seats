<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating Plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --ink:#18181b; --ink-2:#3f3f46; --muted:#71717a; --faint:#a1a1aa;
  --line:#e4e4e7; --line-2:#d4d4d8;
  --accent:#2f5bd3; --accent-soft:#eef2fd; --accent-line:#b9c8f3;
  --danger:#c23a2b; --danger-soft:#fdf1ef;
  --ok:#1f7a4d; --ok-soft:#eef7f2;
  --r:8px;
}
*{box-sizing:border-box}
html{font-size:clamp(15px, 0.5rem + 0.72vw, 26px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:450;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
svg.i{width:1.15em;height:1.15em;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:2.75rem;padding:.5rem 1rem;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);font-weight:550;font-size:.95rem;line-height:1.1;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:#fafafa;border-color:#c4c4ca}
.btn:active{background:#f1f1f2}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#2c2c31}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft);border-color:#efc4bd}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(0,0,0,.045)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default;background:var(--surface)}
.iconbtn{width:2.75rem;padding:0}
.btn.sm{min-height:2.3rem;padding:.3rem .7rem;font-size:.88rem}
.btn.sm.iconbtn{width:2.3rem;padding:0}

/* Top bar */
.topbar{display:flex;align-items:center;gap:.75rem;padding:.65rem 1.25rem;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:4rem}
.brand{font-weight:650;font-size:1.1rem;display:flex;align-items:center;gap:.6rem;letter-spacing:-.01em}
.logo{width:1.4rem;height:1.4rem;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:2px}
.logo i{background:var(--ink);border-radius:2px}
.logo i:nth-child(5){background:var(--accent)}
.spacer{flex:1}
.plan-title{font-weight:650;font-size:1.15rem;border:1px solid transparent;border-radius:var(--r);padding:.35rem .55rem;background:transparent;min-width:6ch;max-width:36vw;letter-spacing:-.01em}
.plan-title:hover{border-color:var(--line)}
.plan-title:focus{outline:none;border-color:var(--accent);background:#fff}

/* Home */
.home{padding:2.5rem clamp(1rem,4vw,4rem);max-width:1400px;width:100%;margin:0 auto}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.75rem}
.home h1{font-size:1.75rem;margin:0 0 .25rem;font-weight:650;letter-spacing:-.02em}
.home .sub{color:var(--muted);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.8rem;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--line-2);box-shadow:0 4px 18px rgba(0,0,0,.05)}
.card h3{margin:0;font-size:1.05rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{color:var(--muted);font-size:.85rem;margin-top:.15rem}
.card .actions{display:flex;gap:.35rem;margin-top:auto}
.mini{background:var(--bg);border-radius:8px;padding:.75rem;display:grid;gap:3px;aspect-ratio:16/10;border-top:3px solid var(--ink-2)}
.mini i{border-radius:2px;background:var(--line)}
.mini i.f{background:var(--ink-2)}
.mini i.x{background:transparent}
.empty-home{border:1px dashed var(--line-2);border-radius:12px;padding:3.5rem 1.5rem;text-align:center;color:var(--muted);background:var(--surface)}
.empty-home h2{color:var(--ink);font-weight:600;font-size:1.25rem;margin:0 0 .4rem}
.empty-home p{margin:0 0 1.4rem}
.home-foot{margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--line);display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.88rem}

/* Editor */
.tabs{display:flex;gap:.25rem;background:var(--bg);padding:.25rem;border-radius:10px;border:1px solid var(--line)}
.tab{border:none;background:transparent;padding:.45rem 1rem;border-radius:7px;font-weight:550;font-size:.95rem;min-height:2.4rem;color:var(--muted);display:inline-flex;align-items:center;gap:.45rem}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{font-size:.75rem;background:var(--accent);color:#fff;border-radius:99px;padding:.05rem .45rem;font-weight:600}
.toolbar{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;padding:.6rem 1.25rem;border-bottom:1px solid var(--line);background:var(--surface)}
.toolbar .sep{width:1px;height:1.6rem;background:var(--line);margin:0 .3rem}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:2px}
.seg button{border:none;background:transparent;border-radius:6px;padding:.3rem .8rem;font-weight:550;font-size:.9rem;min-height:calc(2.75rem - 8px);color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.editor{flex:1;display:flex;min-height:0}
.side{width:clamp(15rem,21vw,24rem);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:1.1rem 1rem 1rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.55rem}
.side-head h2{margin:0;font-size:1rem;font-weight:600;display:flex;flex-direction:column;gap:.15rem}
.count{font-size:.82rem;color:var(--muted);font-weight:500}
.addrow{display:flex;gap:.4rem}
.input{flex:1;min-width:0;min-height:2.75rem;border:1px solid var(--line-2);border-radius:var(--r);padding:.4rem .75rem;background:#fff;font-size:.95rem}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tray{flex:1;overflow:auto;padding:1rem;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.45rem;transition:background .12s}
.tray.hot{background:var(--accent-soft)}
.tray-empty{color:var(--muted);text-align:center;width:100%;padding:2rem .75rem;line-height:1.55;font-size:.92rem}
.tray-empty b{color:var(--ink);font-weight:600;display:block;margin-bottom:.15rem}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:.5rem .8rem;font-weight:550;font-size:.95rem;cursor:grab;min-height:2.6rem;display:flex;align-items:center;max-width:100%;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.chip:hover{border-color:var(--faint)}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.chip.dragging{opacity:.3}

.stage{flex:1;display:flex;flex-direction:column;min-width:0;padding:1.25rem;gap:.8rem}
.gridwrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
.roombox{display:flex;flex-direction:column;gap:14px}
.roombox.flipped{flex-direction:column-reverse}
.front{display:flex;flex-direction:column;align-items:center;gap:.4rem;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.front::before{content:"";display:block;width:60%;height:5px;border-radius:3px;background:var(--ink-2)}
.roombox.flipped .front{flex-direction:column-reverse}
.grid{display:grid;gap:var(--gap,10px)}
.seat{touch-action:none;user-select:none;-webkit-user-select:none;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw) * .07);background:transparent;border:1px dashed var(--line-2);display:flex;align-items:center;justify-content:center;text-align:center;padding:5%;font-weight:600;font-size:var(--fs);line-height:1.12;position:relative;transition:background .12s,border-color .12s,box-shadow .12s;overflow:hidden;word-break:break-word;cursor:pointer;color:var(--ink);letter-spacing:-.01em}
.seat.empty:hover{background:rgba(255,255,255,.6)}
.seat.filled{background:var(--surface);border:1px solid var(--line-2);box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:grab}
.seat.hot{border:2px solid var(--accent);background:var(--accent-soft)}
.seat.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.seat.target{border-color:var(--accent-line);background:rgba(238,242,253,.6)}
.seat.off{border-color:transparent;background:transparent;cursor:default}
.editroom .seat{cursor:pointer}
.editroom .seat:not(.off){background:var(--surface);border:1px solid var(--line-2)}
.editroom .seat.off{border:1px dashed var(--line-2);background:transparent;cursor:pointer}
.editroom .seat.off::after{content:"+";color:var(--faint);font-size:1.4em;font-weight:400}
.seat .nm{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.seat .flag{position:absolute;top:6%;right:6%;color:var(--accent);display:flex}
.seat .flag svg{width:max(.6em,11px);height:max(.6em,11px);stroke-width:2.4}
.seat.locked{background:#f7f9fe;border-color:var(--accent-line)}
.lockmode .seat.filled{cursor:pointer}
.lockmode .seat.empty{opacity:.45}
.seat.dragging{opacity:.3}
.seat.pop{animation:deal .3s both}
@keyframes deal{from{opacity:0;transform:translateY(-6px)}}
.hint{color:var(--muted);text-align:center;font-size:.88rem}
.banner{display:flex;align-items:center;justify-content:center;gap:.75rem;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:var(--r);padding:.55rem 1rem;font-weight:550;font-size:.92rem;text-align:center}
.print-head{display:none}
.toolbar .md{display:none}
.dragghost{position:fixed;left:0;top:0;pointer-events:none;z-index:1000;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:.55rem .95rem;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.16);transform:translate(-50%,-50%);font-size:1rem;white-space:nowrap}

/* Requirements */
.rules{flex:1;overflow:auto;padding:2rem clamp(1rem,3vw,3rem)}
.rules-inner{max-width:1240px;margin:0 auto}
.rules h2{font-size:1.5rem;margin:0 0 .3rem;font-weight:650;letter-spacing:-.02em}
.rules .sub{color:var(--muted);margin:0 0 1.5rem;max-width:46rem;line-height:1.5}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(19rem,1fr));gap:1rem}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1.2rem;display:flex;flex-direction:column;gap:.8rem}
.rcard h3{margin:0;font-size:1.02rem;font-weight:600;display:flex;align-items:center;gap:.6rem}
.rcard h3 .ic{width:2rem;height:2rem;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--ink-2)}
.rcard p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.45}
.select{min-height:2.75rem;border:1px solid var(--line-2);border-radius:var(--r);padding:.3rem .6rem;background:#fff;font-size:.95rem;min-width:0;width:100%}
.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rrow{display:grid;grid-template-columns:1fr auto 1fr;gap:.45rem;align-items:center}
.rrow .btn{grid-column:1/-1}
.rrow.one{grid-template-columns:1fr auto}
.rrow.one .btn{grid-column:auto}
.rrow .and{color:var(--faint);font-weight:500;font-size:.9rem}
.rlist{display:flex;flex-direction:column;gap:.35rem;border-top:1px solid var(--line);padding-top:.8rem}
.ritem{display:flex;align-items:center;gap:.6rem;border-radius:var(--r);padding:.3rem .3rem .3rem .75rem;font-weight:550;background:var(--bg);font-size:.95rem}
.ritem .txt{flex:1}
.ritem .sep2{color:var(--faint);font-weight:400;margin:0 .2rem}
.ritem .st{font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:.25rem}
.ritem.ok .st{color:var(--ok)}
.ritem.bad .st{color:var(--danger)}
.rempty{color:var(--faint);font-size:.9rem;padding:.2rem 0}
.rules-cta{margin:1.5rem 0 0;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.rules-cta .btn{min-height:3.25rem;font-size:1.02rem;padding:.6rem 1.5rem}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(24,24,27,.38);display:flex;align-items:center;justify-content:center;z-index:500;padding:1rem;animation:fade .15s}
.modal{background:var(--surface);border-radius:14px;padding:1.6rem;width:min(42rem,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 64px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:1.1rem;animation:pop .16s}
.modal h2{margin:0;font-size:1.3rem;font-weight:650;letter-spacing:-.015em}
.modal p{margin:0;color:var(--muted);font-size:.93rem;line-height:1.5}
.modal .foot{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap;margin-top:.3rem}
.modal label.lbl{font-weight:600;display:block;margin-bottom:.4rem;font-size:.92rem}
textarea.input{min-height:11rem;resize:vertical;width:100%;line-height:1.45}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(6px);opacity:0}}

.picker-wrap{display:flex;gap:1.5rem;flex-wrap:wrap;align-items:flex-start}
.picker{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;touch-action:none;flex:1;min-width:15rem;max-width:23rem}
.picker i{aspect-ratio:1;border-radius:3px;background:#fff;border:1px solid var(--line-2);cursor:pointer}
.picker i.on{background:var(--accent);border-color:var(--accent)}
.steppers{display:flex;flex-direction:column;gap:.75rem}
.stepper{display:flex;align-items:center;gap:.5rem}
.stepper .lab{width:6.5rem;font-weight:550;font-size:.92rem}
.stepper .val{min-width:2.5ch;text-align:center;font-size:1.3rem;font-weight:650;font-variant-numeric:tabular-nums}
.dims{font-weight:600;color:var(--accent)}

.classlist{display:flex;flex-direction:column;gap:.35rem;max-height:50vh;overflow:auto;padding:2px}
.classlist .row{display:flex;gap:.4rem;align-items:center}
.classlist .row .input{min-height:2.5rem}

.toast{position:fixed;left:50%;top:1rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:10px;font-weight:550;font-size:.95rem;z-index:900;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .18s;max-width:90vw;text-align:center}

@media (max-width: 1500px){
  .toolbar .xl{display:none}
  .toolbar .md{display:inline}
  .toolbar .sep{display:none}
}
@media (max-width: 760px){
  .editor{flex-direction:column}
  .side{width:100%;border-right:none;border-bottom:1px solid var(--line);max-height:40vh}
  .stage{min-height:60vh}
  .plan-title{max-width:60vw}
  .toolbar .sep{display:none}
}
@media print{
  @page{size:landscape;margin:12mm}
  body{background:#fff}
  .topbar,.tabs,.toolbar,.side,.hint,.banner,.toast{display:none!important}
  .stage{padding:0}
  .seat{border:1px solid #888!important;background:#fff!important;box-shadow:none!important;color:#000}
  .seat.empty{border:1px dashed #bbb!important}
  .seat.off{border:none!important}
  .seat .flag{display:none}
  .print-head{display:flex!important;justify-content:space-between;align-items:baseline;font-size:18pt;font-weight:650;margin-bottom:8px;border-bottom:1px solid #000;padding-bottom:6px}
  .print-head small{font-size:10pt;font-weight:500;color:#555}
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
"use strict";
/* ---------- Storage ---------- */
const KEY = "seating-plans-v1";
function loadStore(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.plans)) return s; }catch(e){}
  return {plans:[]};
}
let store = loadStore();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){ toast("Couldn't save in this browser"); }
}
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- App state ---------- */
const state = { lockMode:false, anim:false, view:"home", planId:null, tab:"seats", selected:null, editRoom:false, flipped:false, undo:[] };
const plan = () => store.plans.find(p => p.id === state.planId);
function touch(p){ p.updated = Date.now(); save(); }

function newPlan(name, rows, cols, students){
  const p = { id:uid(), name, rows, cols, off:[], students:students||[], seats:{}, together:[], apart:[], front:[], updated:Date.now() };
  store.plans.unshift(p); save(); return p;
}

/* ---------- Helpers ---------- */
function seatOf(p, sid){ for(const k in p.seats) if(p.seats[k] === sid) return +k; return null; }
function nameOf(p, sid){ const s = p.students.find(s => s.id === sid); return s ? s.name : "?"; }
function seatOrder(p){ // front row first, left to right
  const out = []; for(let r=0;r<p.rows;r++) for(let c=0;c<p.cols;c++){ const i=r*p.cols+c; if(!p.off.includes(i)) out.push(i); } return out;
}
function cleanSeats(p){ // drop seats pointing at deleted students / off cells / out of range
  const ids = new Set(p.students.map(s=>s.id));
  for(const k in p.seats){ if(!ids.has(p.seats[k]) || p.off.includes(+k) || +k >= p.rows*p.cols) delete p.seats[k]; }
  const ok = r => ids.has(r[0]) && ids.has(r[1]);
  p.together = p.together.filter(ok); p.apart = p.apart.filter(ok);
  p.front = p.front.filter(id => ids.has(id));
  p.locked = (p.locked||[]).filter(i => p.seats[i] != null);
}
function pushUndo(p){ state.undo.push(JSON.stringify(p.seats)); if(state.undo.length>50) state.undo.shift(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function neighbours(p, a, b){
  if(a==null || b==null) return false;
  const ra=Math.floor(a/p.cols), rb=Math.floor(b/p.cols);
  return ra===rb && Math.abs(a-b)===1;
}

/* ---------- CSV / list parsing ---------- */
function parseNames(text){
  text = text.replace(/\r/g,"").trim();
  if(!text) return [];
  const splitLine = line => {
    const out=[]; let cur="", q=false;
    for(const ch of line){
      if(ch === '"'){ q=!q; continue; }
      if(!q && (ch === "," || ch === "\t" || ch === ";")){ out.push(cur.trim()); cur=""; continue; }
      cur += ch;
    }
    out.push(cur.trim()); return out;
  };
  let lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  if(lines.length === 1){ // "Ann, Bob, Cara" on one line
    return splitLine(lines[0]).filter(Boolean);
  }
  const rows = lines.map(splitLine);
  const multi = rows.filter(r => r.filter(Boolean).length > 1).length;
  if(multi < rows.length/2) return rows.map(r => r.filter(Boolean).join(" ")).filter(Boolean);
  // table-like: look for a header row
  const head = rows[0].map(h => h.toLowerCase());
  const find = (...keys) => head.findIndex(h => keys.some(k => h.includes(k)));
  const iFirst = find("first","forename","given","preferred");
  const iLast  = find("last","surname","family");
  const iName  = head.findIndex(h => h === "name" || h === "student" || h === "full name" || h === "student name" || h==="pupil" || h==="pupil name");
  const hasHeader = iFirst>=0 || iLast>=0 || iName>=0 || head.some(h => /name|email|id|class|year|form/.test(h));
  let body = hasHeader ? rows.slice(1) : rows;
  let names;
  if(iFirst>=0 && iLast>=0) names = body.map(r => [r[iFirst], r[iLast]].filter(Boolean).join(" "));
  else if(iName>=0) names = body.map(r => r[iName]);
  else if(iFirst>=0) names = body.map(r => r[iFirst]);
  else {
    // no clear header: use the first one or two text-only columns
    const isWordy = v => v && /[a-z]/i.test(v) && !/@|\d{3,}/.test(v);
    names = body.map(r => {
      const cols = r.filter(isWordy);
      if(cols.length >= 2 && cols[0].split(" ").length===1 && cols[1].split(" ").length===1) return cols[0]+" "+cols[1];
      return cols[0] || "";
    });
  }
  return names.map(n => (n||"").trim()).filter(Boolean);
}

/* ---------- Arranging ---------- */
function randomArrange(p){
  pushUndo(p);
  cleanSeats(p);
  const keep = {}; for(const i of p.locked) keep[i] = p.seats[i];
  const fixed = new Set(Object.values(keep));
  const order = seatOrder(p).filter(i => keep[i]==null);
  const ids = shuffle(p.students.map(s=>s.id).filter(id => !fixed.has(id)));
  p.seats = {...keep};
  ids.slice(0, order.length).forEach((id,i) => p.seats[order[i]] = id);
  touch(p);
  const left = ids.length - order.length;
  toast(left>0 ? `Shuffled. ${left} student${left>1?"s":""} didn't fit – add more desks.` : "Shuffled");
}
function scoreLayout(p, pos){ // pos: Map sid -> seat
  let s = 0;
  for(const [a,b] of p.together) if(neighbours(p,pos.get(a),pos.get(b))) s += 10;
  for(const [a,b] of p.apart){ const A=pos.get(a), B=pos.get(b); if(A!=null&&B!=null){ if(neighbours(p,A,B)) s -= 12; else { const d=Math.abs(Math.floor(A/p.cols)-Math.floor(B/p.cols))+Math.abs(A%p.cols-B%p.cols); if(d<=2) s -= 1; } } }
  for(const id of p.front){ const A=pos.get(id); if(A!=null) s -= 4*Math.floor(A/p.cols); }
  return s;
}
function ruleStatus(p){
  const pos = new Map(Object.entries(p.seats).map(([k,v])=>[v,+k]));
  const firstRow = Math.min(...seatOrder(p).map(i=>Math.floor(i/p.cols)));
  const t = p.together.map(([a,b]) => neighbours(p,pos.get(a),pos.get(b)));
  const ap = p.apart.map(([a,b]) => { const A=pos.get(a),B=pos.get(b); return !(A!=null&&B!=null&&neighbours(p,A,B)); });
  const f = p.front.map(id => { const A=pos.get(id); return A!=null && Math.floor(A/p.cols) <= firstRow; });
  const all=[...t,...ap,...f];
  return {t,ap,f,met:all.filter(Boolean).length,total:all.length,seated:pos};
}
function smartArrange(p){
  if(!p.students.length){ toast("Add some students first"); return; }
  cleanSeats(p);
  const keep = new Map(); for(const i of p.locked) keep.set(p.seats[i], i);
  const order = seatOrder(p).filter(i => !p.locked.includes(i));
  const ids = p.students.map(s=>s.id).filter(id => !keep.has(id));
  pushUndo(p);
  const n = Math.min(ids.length, order.length);
  let best=null, bestScore=-Infinity;
  const t0 = performance.now();
  for(let run=0; run<60 && performance.now()-t0 < 700; run++){
    const perm = shuffle(ids.slice());
    // seats used: first n of order; perm[0..n-1] seated, rest unseated
    const pos = new Map(keep); perm.forEach((id,i) => pos.set(id, i<n ? order[i] : null));
    let sc = scoreLayout(p,pos);
    for(let it=0; it<3000; it++){
      if(!n) break;
      const i=Math.floor(Math.random()*perm.length), j=Math.floor(Math.random()*n);
      if(i===j) continue;
      const a=perm[i], b=perm[j];
      const pa=pos.get(a), pb=pos.get(b);
      pos.set(a,pb); pos.set(b,pa);
      const ns = scoreLayout(p,pos);
      if(ns >= sc || Math.random() < 0.002){ sc=ns; [perm[i],perm[j]]=[perm[j],perm[i]]; }
      else { pos.set(a,pa); pos.set(b,pb); }
    }
    if(sc > bestScore){ bestScore=sc; best=new Map(pos); }
  }
  p.seats = {};
  if(!best) best = new Map(keep);
  for(const [id,seat] of best) if(seat!=null) p.seats[seat]=id;
  touch(p);
  const st = ruleStatus(p);
  if(st.total===0) toast("Shuffled! (No requirements set yet)");
  else if(st.met===st.total) toast(st.total===1 ? "Requirement met" : `All ${st.total} requirements met`);
  else toast(`${st.met} of ${st.total} requirements met – the rest weren't possible`);
}

/* ---------- Names ---------- */
function displayName(p, sid){
  const n = nameOf(p, sid);
  if(p.names !== "first") return n;
  const first = n.trim().split(/\s+/)[0];
  // if two students share a first name, add a surname initial so they can be told apart
  const clash = p.students.some(s => s.id !== sid && s.name.trim().split(/\s+/)[0].toLowerCase() === first.toLowerCase());
  const w = n.trim().split(/\s+/);
  return clash && w.length > 1 ? `${first} ${w[w.length-1][0].toUpperCase()}.` : first;
}

function miniGrid(p){
  const cells=[]; for(let i=0;i<p.rows*p.cols;i++){ const cls = p.off.includes(i) ? "x" : (p.seats[i] ? "f" : ""); cells.push(`<i class="${cls}"></i>`); }
  return `<div class="mini" style="grid-template-columns:repeat(${p.cols},1fr);grid-template-rows:repeat(${p.rows},1fr)">${cells.join("")}</div>`;
}
function when(t){
  const d = new Date(t), now = new Date();
  if(d.toDateString()===now.toDateString()) return "Edited today " + d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  return "Edited " + d.toLocaleDateString([], {day:"numeric",month:"short",year: d.getFullYear()===now.getFullYear()?undefined:"numeric"});
}

/* Fit desks to the available space */
function layoutGrid(){
  const p = plan(), wrap = document.getElementById("gridwrap"), grid = document.getElementById("grid"), front = document.getElementById("front");
  if(!wrap || !grid) return;
  const W = wrap.clientWidth, H = (wrap.clientHeight || window.innerHeight*0.6) - (front ? front.offsetHeight + 14 : 0);
  const gap = Math.max(6, Math.min(14, W/p.cols*0.07));
  let cw = (W - gap*(p.cols-1)) / p.cols;
  let ch = (H - gap*(p.rows-1)) / p.rows;
  ch = Math.min(ch, cw*0.68); cw = Math.min(cw, ch/0.5, 250); ch = Math.min(ch, cw*0.68);
  grid.style.setProperty("--cw", cw+"px");
  grid.style.setProperty("--ch", ch+"px");
  grid.style.setProperty("--gap", gap+"px");
  grid.style.setProperty("--fs", Math.max(11, Math.min(cw*0.14, ch*0.25, 28))+"px");
}

let toastTimer;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(), 3200);
}
function modal(html, onMount){
  const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="modal" role="dialog">${html}</div>`;
  document.body.appendChild(o);
  const close=()=>{ o.remove(); document.removeEventListener("keydown",key); };
  const key=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",key);
  o.addEventListener("pointerdown", e=>{ if(e.target===o) o.dataset.down="1"; });
  o.addEventListener("click", e=>{ if(e.target===o && o.dataset.down) close(); o.dataset.down=""; });
  o.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  onMount && onMount(o.querySelector(".modal"), close);
  return close;
}
function confirmBox(title, text, okLabel, onOk){
  modal(`<h2>${title}</h2><p>${text}</p><div class="foot"><button class="btn" data-close>Cancel</button><button class="btn danger" id="ok">${okLabel}</button></div>`,
    (m,close)=>{ m.querySelector("#ok").onclick=()=>{ close(); onOk(); }; });
}

function sizeModal(opts){
  // opts: {title, rows, cols, name?, withName, okLabel, onOk(rows, cols, name, fromId, names)}
  let rows=opts.rows, cols=opts.cols;
  const others = store.plans.filter(p=>p.students.length);
  modal(`
    <h2>${opts.title}</h2>
    ${opts.withName?`<div><label class="lbl" for="pn">Name</label><input class="input" id="pn" style="width:100%" value="${esc(opts.name||"")}" placeholder="e.g. 9B Maths"></div>`:""}
    <div>
      <label class="lbl">Room size — <span class="dims" id="dims"></span></label>
      <p style="margin:-.2rem 0 .7rem">Drag across the grid, or use the buttons. Rows count back from the board.</p>
      <div class="picker-wrap">
        <div class="picker" id="picker">${Array.from({length:120},(_,i)=>`<i data-r="${Math.floor(i/12)+1}" data-c="${i%12+1}"></i>`).join("")}</div>
        <div class="steppers">
          <div class="stepper"><span class="lab">Rows</span><button class="btn iconbtn" data-st="r-" aria-label="Fewer rows">${I("minus")}</button><span class="val" id="rv"></span><button class="btn iconbtn" data-st="r+" aria-label="More rows">${I("plus")}</button></div>
          <div class="stepper"><span class="lab">Desks per row</span><button class="btn iconbtn" data-st="c-" aria-label="Fewer desks per row">${I("minus")}</button><span class="val" id="cv"></span><button class="btn iconbtn" data-st="c+" aria-label="More desks per row">${I("plus")}</button></div>
        </div>
      </div>
    </div>
    ${opts.withName && others.length?`<div><label class="lbl" for="from">Start with students from</label><select class="select" id="from" style="width:100%"><option value="">Nobody – I'll add them</option>${others.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.students.length})</option>`).join("")}</select></div>`:""}
    <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok">${opts.okLabel}</button></div>`,
  (m,close)=>{
    const pick=m.querySelector("#picker");
    const paint=(r,c)=>{ pick.querySelectorAll("i").forEach(i=>i.classList.toggle("on", +i.dataset.r<=r && +i.dataset.c<=c)); };
    const upd=()=>{ m.querySelector("#rv").textContent=rows; m.querySelector("#cv").textContent=cols; m.querySelector("#dims").textContent=`${rows} × ${cols} = ${rows*cols} desks`; paint(rows,cols); };
    upd();
    let down=false;
    const at=e=>{ const el=document.elementFromPoint(e.clientX,e.clientY); return el && el.parentNode===pick ? el : null; };
    pick.addEventListener("pointerdown",e=>{ down=true; pick.setPointerCapture(e.pointerId); const el=at(e); if(el){ rows=+el.dataset.r; cols=+el.dataset.c; upd(); } });
    pick.addEventListener("pointermove",e=>{ const el=at(e); if(!el) return; if(down){ rows=+el.dataset.r; cols=+el.dataset.c; upd(); } else paint(+el.dataset.r,+el.dataset.c); });
    pick.addEventListener("pointerup",()=>{ down=false; });
    pick.addEventListener("pointerleave",()=>{ if(!down) paint(rows,cols); });
    m.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ const k=b.dataset.st; if(k==="r-")rows=Math.max(1,rows-1); if(k==="r+")rows=Math.min(20,rows+1); if(k==="c-")cols=Math.max(1,cols-1); if(k==="c+")cols=Math.min(20,cols+1); upd(); });
    const nameEl=m.querySelector("#pn"); if(nameEl) setTimeout(()=>nameEl.focus(),50);
    m.querySelector("#ok").onclick=()=>{
      const name = nameEl ? (nameEl.value.trim() || "Untitled plan") : null;
      const from = m.querySelector("#from")?.value || null;
      close(); opts.onOk(rows, cols, name, from);
    };
    if(nameEl) nameEl.addEventListener("keydown",e=>{ if(e.key==="Enter") m.querySelector("#ok").click(); });
  });
}

function pasteModal(){
  const p=plan();
  modal(`
    <h2>Add your class list</h2>
    <p>Paste names below — one per line, separated by commas, or straight from a spreadsheet. You can also open a CSV file.</p>
    <textarea class="input" id="pt" placeholder="Amelia Jones&#10;Ben Carter&#10;Chloe Patel&#10;…"></textarea>
    <div class="addrow" style="align-items:center"><label class="btn" style="cursor:pointer">${I("file")}Open a CSV file<input type="file" id="pf" accept=".csv,.txt,.tsv,text/csv,text/plain" hidden></label><span class="count" id="pc" style="font-size:1rem"></span></div>
    <div class="foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok" disabled>Add students</button></div>`,
  (m,close)=>{
    const ta=m.querySelector("#pt"), pc=m.querySelector("#pc"), ok=m.querySelector("#ok");
    const upd=()=>{ const n=parseNames(ta.value); pc.textContent = n.length ? `Found ${n.length} name${n.length>1?"s":""}: ${n.slice(0,4).join(", ")}${n.length>4?"…":""}` : ""; ok.disabled=!n.length; ok.textContent = n.length?`Add ${n.length} student${n.length>1?"s":""}`:"Add students"; };
    ta.addEventListener("input",upd);
    setTimeout(()=>ta.focus(),50);
    m.querySelector("#pf").onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ ta.value=t; upd(); }); };
    ok.onclick=()=>{
      const names=parseNames(ta.value);
      const existing=new Set(p.students.map(s=>s.name.toLowerCase()));
      let added=0, skipped=0;
      for(const n of names){ if(existing.has(n.toLowerCase())){ skipped++; continue; } existing.add(n.toLowerCase()); p.students.push({id:uid(),name:n}); added++; }
      touch(p); close(); render();
      toast(`Added ${added} student${added===1?"":"s"}${skipped?` (${skipped} already in the list)`:""}`);
    };
  });
}

function classListModal(){
  const p=plan();
  const rowsHtml=()=>p.students.length ? p.students.map(s=>`<div class="row"><input class="input" data-rn="${s.id}" value="${esc(s.name)}"><button class="btn iconbtn danger" data-rs="${s.id}" aria-label="Remove ${esc(s.name)}">${I("trash")}</button></div>`).join("") : `<p>No students yet.</p>`;
  modal(`<h2>Class list (${p.students.length})</h2><p>Change a name by typing over it, or remove a student.</p>
    <div class="classlist" id="cl">${rowsHtml()}</div>
    <div class="foot">${p.students.length?`<button class="btn danger" id="rmall" style="margin-right:auto">Remove everyone</button>`:""}<button class="btn primary" data-close>Done</button></div>`,
  (m,close)=>{
    const cl=m.querySelector("#cl");
    const bind=()=>{
      cl.querySelectorAll("[data-rn]").forEach(inp=>inp.oninput=()=>{ const s=p.students.find(s=>s.id===inp.dataset.rn); if(s && inp.value.trim()){ s.name=inp.value.trim(); touch(p); } });
      cl.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{ p.students=p.students.filter(s=>s.id!==b.dataset.rs); cleanSeats(p); touch(p); cl.innerHTML=rowsHtml(); bind(); m.querySelector("h2").textContent=`Class list (${p.students.length})`; });
    };
    bind();
    const ra=m.querySelector("#rmall"); if(ra) ra.onclick=()=>{ close(); confirmBox("Remove everyone?","This removes all students and requirements from this plan.","Remove all",()=>{ p.students=[]; p.seats={}; cleanSeats(p); touch(p); render(); }); };
    const obs=new MutationObserver(()=>{ if(!document.body.contains(m)){ obs.disconnect(); render(); } });
    obs.observe(document.body,{childList:true});
  });
}

/* ---------- Actions ---------- */
function openPlan(id){ state.view="editor"; state.planId=id; state.tab="seats"; state.selected=null; state.editRoom=false; state.undo=[]; render(); }

function place(p, sid, seat){
  if(p.off.includes(seat)) return;
  const lk = p.locked||[];
  if(lk.includes(seatOf(p,sid)) || (p.seats[seat] && p.seats[seat]!==sid && lk.includes(seat))){ toast("That desk is locked. Use Lock to unlock it."); return; }
  pushUndo(p);
  const cur=seatOf(p,sid), occ=p.seats[seat];
  if(occ===sid) { state.undo.pop(); return; }
  if(cur!=null) delete p.seats[cur];
  if(occ && cur!=null) p.seats[cur]=occ;
  p.seats[seat]=sid;
  touch(p);
}
function unseat(p, sid){ const cur=seatOf(p,sid); if(cur!=null && (p.locked||[]).includes(cur)){ toast("That desk is locked"); return; } if(cur!=null){ pushUndo(p); delete p.seats[cur]; touch(p); } }

app.addEventListener("click", e=>{
  if(justDragged){ justDragged=false; return; }
  const t=e.target.closest("[data-names],[data-act],[data-open],[data-dup],[data-del],[data-tab],[data-add],[data-rm],.seat,.chip,.tray");
  if(!t) return;
  const p=plan();
  if(t.dataset.dup){ e.stopPropagation(); const src=store.plans.find(x=>x.id===t.dataset.dup); const c=JSON.parse(JSON.stringify(src)); c.id=uid(); c.name=src.name+" (copy)"; c.updated=Date.now(); store.plans.unshift(c); save(); render(); toast("Plan copied"); return; }
  if(t.dataset.del){ e.stopPropagation(); const src=store.plans.find(x=>x.id===t.dataset.del); confirmBox("Delete this plan?",`“${esc(src.name)}” will be gone for good.`,"Delete",()=>{ store.plans=store.plans.filter(x=>x!==src); save(); render(); }); return; }
  if(t.dataset.open){ openPlan(t.dataset.open); return; }
  if(t.dataset.names){ p.names=t.dataset.names; touch(p); render(); return; }
  if(t.dataset.tab){ state.tab=t.dataset.tab; state.selected=null; render(); return; }
  if(t.dataset.add){
    const k=t.dataset.add;
    if(k==="front"){ const a=document.getElementById("fa").value; if(!a) return toast("Pick a student"); if(p.front.includes(a)) return toast("Already on the list"); p.front.push(a); }
    else {
      const a=document.getElementById(k==="together"?"ta":"aa").value, b=document.getElementById(k==="together"?"tb":"ab").value;
      if(!a||!b) return toast("Pick two students");
      if(a===b) return toast("Pick two different students");
      const list=p[k]; if(list.some(r=>(r[0]===a&&r[1]===b)||(r[0]===b&&r[1]===a))) return toast("That pair is already there");
      const other=k==="together"?p.apart:p.together;
      if(other.some(r=>(r[0]===a&&r[1]===b)||(r[0]===b&&r[1]===a))) return toast(k==="together"?"That pair is set to keep apart":"That pair is set to sit together");
      list.push([a,b]);
    }
    touch(p); render(); return;
  }
  if(t.dataset.rm){ const [k,i]=t.dataset.rm.split(":"); p[k].splice(+i,1); touch(p); render(); return; }
  const act=t.dataset.act;
  if(act){
    switch(act){
      case "home": state.view="home"; render(); break;
      case "new": sizeModal({title:"New seating plan", withName:true, rows:5, cols:6, okLabel:"Create plan", onOk:(r,c,name,from)=>{
          const src=from && store.plans.find(x=>x.id===from);
          const students = src ? src.students.map(s=>({...s})) : [];
          const np=newPlan(name,r,c,students);
          if(src){ np.together=JSON.parse(JSON.stringify(src.together)); np.apart=JSON.parse(JSON.stringify(src.apart)); np.front=[...src.front]; }
          save(); openPlan(np.id);
        }}); break;
      case "random": if(!p.students.length) return toast("Add some students first"); randomArrange(p); state.anim=true; render(); break;
      case "smart": if(!p.students.length) return toast("Add some students first");
        if(!(p.together.length+p.apart.length+p.front.length)){ toast("No requirements yet — set some up in this tab"); state.tab="rules"; render(); break; }
        smartArrange(p); state.anim=true; render(); break;
      case "smartgo": smartArrange(p); if(p.students.length){ state.tab="seats"; state.anim=true; } render(); break;
      case "undo": if(state.undo.length){ p.seats=JSON.parse(state.undo.pop()); touch(p); render(); } break;
      case "clear": if(!Object.keys(p.seats).length) return toast("No one is seated yet"); pushUndo(p); { const k={}; for(const i of p.locked) k[i]=p.seats[i]; p.seats=k; } touch(p); render(); toast("Everyone's back in the list (Undo to bring them back)"); break;
      case "editroom": state.editRoom=!state.editRoom; state.lockMode=false; state.selected=null; render(); break;
      case "lockmode": state.lockMode=!state.lockMode; state.editRoom=false; state.selected=null; render(); break;
      case "flip": state.flipped=!state.flipped; render(); break;
      case "print": window.print(); break;
      case "full": try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} break;
      case "paste": pasteModal(); break;
      case "classlist": classListModal(); break;
      case "resize": sizeModal({title:"Change room size", rows:p.rows, cols:p.cols, okLabel:"Resize", onOk:(r,c)=>{
          // keep desks at the same row/column positions
          const seats={}, off=[];
          for(const k in p.seats){ const rr=Math.floor(k/p.cols), cc=k%p.cols; if(rr<r&&cc<c) seats[rr*c+cc]=p.seats[k]; }
          for(const k of p.off){ const rr=Math.floor(k/p.cols), cc=k%p.cols; if(rr<r&&cc<c) off.push(rr*c+cc); }
          pushUndo(p); state.undo=[]; p.rows=r; p.cols=c; p.seats=seats; p.off=off; touch(p); render();
        }}); break;
      case "export": exportAll(); break;
      case "import": importAll(); break;
    }
    return;
  }
  // seats / chips / tray (tap mode)
  if(state.view!=="editor") return;
  if(t.classList.contains("seat")){
    const i=+t.dataset.seat;
    if(state.editRoom){
      const k=p.off.indexOf(i);
      if(k>=0) p.off.splice(k,1); else { p.off.push(i); delete p.seats[i]; }
      state.undo=[]; touch(p); render(); return;
    }
    if(t.classList.contains("off")) return;
    const sid=p.seats[i];
    if(state.lockMode){
      if(!sid) return toast("Only desks with a student can be locked");
      const k=p.locked.indexOf(i); if(k>=0) p.locked.splice(k,1); else p.locked.push(i);
      touch(p); render(); return;
    }
    if(state.selected){
      if(state.selected===sid){ state.selected=null; }
      else { place(p,state.selected,i); state.selected=null; }
    } else if(sid) state.selected=sid;
    render(); return;
  }
  if(t.classList.contains("chip")){ const sid=t.dataset.sid; state.selected = state.selected===sid ? null : sid; render(); return; }
  if(t.classList.contains("tray") && state.selected){ unseat(p,state.selected); state.selected=null; render(); return; }
});

app.addEventListener("submit", e=>{
  if(e.target.id!=="addform") return;
  e.preventDefault();
  const inp=document.getElementById("addname"), raw=inp.value.trim(); if(!raw) return;
  const p=plan();
  const names = /[,\t;\n]/.test(raw) ? parseNames(raw) : [raw];
  for(const n of names) p.students.push({id:uid(), name:n});
  touch(p); render();
  const ni=document.getElementById("addname"); ni && ni.focus();
});
app.addEventListener("input", e=>{
  if(e.target.id==="title"){ const p=plan(); p.name=e.target.value.trim()||"Untitled plan"; touch(p); }
});
app.addEventListener("keydown", e=>{ if(e.target.id==="title" && e.key==="Enter") e.target.blur(); });
app.addEventListener("paste", e=>{ // pasting several lines into the add box opens it straight in
  if(e.target.id!=="addname") return;
  const txt=(e.clipboardData||window.clipboardData).getData("text");
  if(txt && txt.trim().includes("\n")){ e.preventDefault(); pasteModal(); setTimeout(()=>{ const ta=document.getElementById("pt"); if(ta){ ta.value=txt; ta.dispatchEvent(new Event("input")); } },60); }
});

/* ---------- Drag & drop (mouse, touch, pen) ---------- */
let drag=null, justDragged=false;
app.addEventListener("pointerdown", e=>{
  if(state.view!=="editor" || state.editRoom || state.lockMode || e.button>0) return;
  const el=e.target.closest("[data-sid]"); if(!el) return;
  drag={sid:el.dataset.sid, el, x:e.clientX, y:e.clientY, started:false, ghost:null, hot:null};
});
window.addEventListener("pointermove", e=>{
  if(!drag) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 8) return;
    drag.started=true;
    const g=document.createElement("div"); g.className="dragghost"; g.textContent=displayName(plan(),drag.sid); document.body.appendChild(g); drag.ghost=g;
    drag.el.classList.add("dragging"); state.selected=null;
    document.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));
  }
  e.preventDefault();
  drag.ghost.style.left=e.clientX+"px"; drag.ghost.style.top=e.clientY+"px";
  const under=document.elementFromPoint(e.clientX,e.clientY);
  const tgt=under && (under.closest(".seat:not(.off)") || under.closest(".tray"));
  if(tgt!==drag.hot){ drag.hot && drag.hot.classList.remove("hot"); drag.hot=tgt; tgt && tgt.classList.add("hot"); }
}, {passive:false});
function endDrag(e, cancel){
  if(!drag) return;
  const d=drag; drag=null;
  if(!d.started) return;
  d.ghost.remove(); d.el.classList.remove("dragging"); d.hot && d.hot.classList.remove("hot");
  justDragged=true; setTimeout(()=>justDragged=false, 0);
  if(cancel || !d.hot) return;
  const p=plan();
  if(d.hot.classList.contains("tray")) unseat(p,d.sid);
  else place(p,d.sid,+d.hot.dataset.seat);
  render();
}
window.addEventListener("pointerup", e=>endDrag(e,false));
window.addEventListener("pointercancel", e=>endDrag(e,true));

/* ---------- Backup ---------- */
function exportAll(){
  const blob=new Blob([JSON.stringify(store,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`seating-plans-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importAll(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; f.text().then(t=>{
    try{ const s=JSON.parse(t); if(!Array.isArray(s.plans)) throw 0;
      const have=new Set(store.plans.map(p=>p.id)); let n=0;
      for(const p of s.plans){ if(!have.has(p.id)){ store.plans.push(p); n++; } }
      save(); render(); toast(`Restored ${n} plan${n===1?"":"s"}`);
    }catch(e){ toast("That file isn't a seating plan backup"); }
  }); };
  inp.click();
}

render();
</script>
